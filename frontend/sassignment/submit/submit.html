<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nộp Assignment</title>
  <link rel="stylesheet" href="submit.css" />
   <link rel="stylesheet" href="../../components/sburger/burger.css" />
</head>
<body>
  <div class="overlay">
    <div class="form-container">
      <h1>Nộp Assignment</h1>
      <form id="submit-form">
        <input type="text" id="content_url" name="content_url" placeholder="Link nộp bài" required />
        <button type="submit">Nộp</button>
      </form>
      <div class="back-btn-wrapper">
          <button id="back-btn" class="back-btn">Quay lại</button>
      </div>     
    </div>
  </div>

  <script src="submit.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '../sassignment.html';
    });
  </script>
  <burger-sidebar></burger-sidebar>
  <script src="../../components/sburger/burger.js"></script>
  <script src="../../components/sburger/action.js"></script>
</body>
</html>
