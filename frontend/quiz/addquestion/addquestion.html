<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thêm câu hỏi mới</title>
  <link rel="stylesheet" href="addquestion.css" />
   <link rel="stylesheet" href="../../components/burger/burger.css" />
</head>
<body>
  <div class="overlay">
    <div class="form-container">
      <h1>Thêm câu hỏi mới</h1>
      <form id="create-question-form">
        <input type="text" name="title" placeholder="Title" required />
        <input type="text" name="optionA" placeholder="A" required />
        <input type="text" name="optionB" placeholder="B" required />
        <input type="text" name="optionC" placeholder="C" required />
        <input type="text" name="optionD" placeholder="D" required />
        <select name="corectoption" required>
          <option value="">-- Đáp án đúng --</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
        <input type="number" name="point" placeholder="Điểm câu hỏi" required />
        <input type="number" name="position" placeholder="Vị trí câu hỏi" required />      
        <button type="submit">Thêm câu hỏi</button>
      </form>
      <div class="back-btn-wrapper">
          <button id="back-btn" class="back-btn">Quay lại</button>
      </div>
    </div>
  </div>

  <script src="addquestion.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '../quiz.html';
    });
  </script>
  <burger-sidebar></burger-sidebar>
  <script src="../../components/burger/burger.js"></script>
  <script src="../../components/burger/action.js"></script>
</body>
</html>
