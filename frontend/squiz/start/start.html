<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Làm Quiz</title>
  <link rel="stylesheet" href="start.css" />
</head>
<body>
  <div class="overlay">
    <div class="quiz-container">
      <h1>Bài Quiz</h1>
      <div id="timer" class="timer">Thời gian còn lại: --:--</div>
      <form id="quiz-form">
        <div id="question-list" class="question-list">
          <!-- Câu hỏi sẽ render tại đây -->
        </div>
        <button type="submit" class="submit-btn">Nộp</button>
      </form>
    </div>
  </div>

  <script src="start.js"></script>
</body>
</html>
