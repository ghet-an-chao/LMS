<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tạo assignment mới</title>
  <link rel="stylesheet" href="createassignment.css" />
  <link rel="stylesheet" href="../../components/burger/burger.css" />
</head>
<body>
  <div class="overlay">
    <div class="form-container">
      <h1>Tạo assignment mới</h1>
      <form id="create-course-form">
        <input type="text" name="title" placeholder="Tiêu đề" required />
        <input type="text" name="weight_pct" placeholder="Tỉ trọng" required />
        <input type="datetime-local" name="due_at" placeholder="Thời gian hết hạn" required />
        <input type="number" name="max_score" placeholder="Điểm tối đa" required />
        <button type="submit">Tạo assignment</button>
      </form>
      <div class="back-btn-wrapper">
          <button id="back-btn" class="back-btn">Quay lại</button>
      </div>
    </div>
  </div>

  <script src="createassignment.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '../assignment.html';
    });
  </script>
  <burger-sidebar></burger-sidebar>
  <script src="../../components/burger/burger.js"></script>
  <script src="../../components/burger/action.js"></script>
</body>
</html>
