<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tạo bài giảng mới</title>
  <link rel="stylesheet" href="createlecture.css" />
  <link rel="stylesheet" href="../../components/burger/burger.css" />
</head>
<body>
  <div class="overlay">
    <div class="form-container">
      <h1>Tạo bài giảng mới</h1>
      <form id="create-course-form">
        <input type="text" name="title" placeholder="Tiêu đề" required />
        <input type="text" name="content_url" placeholder="Content URL" required />
        <input type="text" name="reference_links" placeholder="Reference Links" required />
        <input type="number" name="position" placeholder="Vị trí sắp xếp" min="1" required />
        <button type="submit">Tạo bài giảng</button>
      </form>
      <div class="back-btn-wrapper">
          <button id="back-btn" class="back-btn">Quay lại</button>
      </div>
    </div>
  </div>

  <script src="createlecture.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '../lecture.html';
    });
  </script>
  <burger-sidebar></burger-sidebar>
  <script src="../../components/burger/burger.js"></script>
  <script src="../../components/burger/action.js"></script>
</body>
</html>
